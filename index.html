<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0c">
    <title>OctaneLab — Calculateur de mix E85</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="apple-touch-icon" href="favicon.svg">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>

    <main class="app">
        <header class="header">
            <div class="brand">
                <div class="brand-mark">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 2 L4 12 L8 12 L8 22 L16 12 L20 12 Z"/>
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>OctaneLab</h1>
                    <span class="brand-sub">Mix E85 · Précision pompe</span>
                </div>
            </div>
            <div class="season-pill" id="seasonPill">
                <span class="season-dot"></span>
                <span id="seasonLabel">…</span>
            </div>
        </header>

        <section class="card preset-card">
            <div class="card-head">
                <h2>Preset véhicule</h2>
                <button type="button" class="link-btn" id="newPresetBtn">+ Nouveau</button>
            </div>
            <div class="preset-list" id="presetList"></div>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>Configuration</h2>
            </div>

            <div class="field">
                <label for="targetEthanol">Cible éthanol dans le réservoir</label>
                <div class="slider-row">
                    <input type="range" id="targetEthanol" min="0" max="85" step="1" value="50">
                    <output for="targetEthanol" id="targetEthanolOut">50%</output>
                </div>
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="tankCapacity">Capacité réservoir</label>
                    <div class="input-suffix">
                        <input type="number" id="tankCapacity" min="1" max="200" step="1" inputmode="decimal" value="55">
                        <span>L</span>
                    </div>
                </div>
                <div class="field">
                    <label for="totalBars">Barres totales</label>
                    <input type="number" id="totalBars" min="1" max="50" step="1" inputmode="numeric" value="20">
                </div>
            </div>

            <div class="field">
                <label for="remainingBars">Barres restantes sur la jauge</label>
                <div class="bar-stepper">
                    <button type="button" class="step-btn" id="barMinus" aria-label="Moins">−</button>
                    <input type="number" id="remainingBars" min="0" step="1" inputmode="numeric" value="5">
                    <button type="button" class="step-btn" id="barPlus" aria-label="Plus">+</button>
                </div>
                <div class="bar-visual" id="barVisual"></div>
            </div>

            <div class="field">
                <label>Essence à ajouter</label>
                <div class="seg" id="fuelSeg" role="radiogroup">
                    <button type="button" class="seg-opt" data-fuel="SP95" role="radio">SP95</button>
                    <button type="button" class="seg-opt" data-fuel="SP95E10" role="radio">SP95-E10</button>
                    <button type="button" class="seg-opt active" data-fuel="SP98E5" role="radio">SP98-E5</button>
                </div>
            </div>

            <label class="toggle" for="remainingPure">
                <input type="checkbox" id="remainingPure">
                <span class="toggle-track"><span class="toggle-thumb"></span></span>
                <span class="toggle-body">
                    <span class="toggle-title">Restant = essence pure</span>
                    <span class="toggle-sub">À cocher pour un premier mix. Sinon le restant est supposé déjà au taux cible.</span>
                </span>
            </label>
        </section>

        <section class="card result-card" id="resultCard">
            <div class="card-head">
                <h2>Résultat</h2>
                <span class="meta" id="resultMeta">—</span>
            </div>
            <div class="result-grid">
                <div class="result-tile e85">
                    <span class="result-label">E85</span>
                    <span class="result-value" id="e85Value">—</span>
                    <span class="result-unit">litres</span>
                </div>
                <div class="result-tile gas">
                    <span class="result-label" id="gasLabel">Essence</span>
                    <span class="result-value" id="gasValue">—</span>
                    <span class="result-unit">litres</span>
                </div>
            </div>
            <div class="result-detail" id="resultDetail"></div>
            <div class="result-warn" id="resultWarn" hidden></div>
        </section>

    </main>

    <dialog id="presetDialog" class="modal">
        <form method="dialog" class="modal-form" id="presetForm">
            <h3 id="presetDialogTitle">Nouveau preset</h3>

            <div class="field">
                <label for="pName">Nom</label>
                <input type="text" id="pName" required maxlength="40" placeholder="Ex : BMW Z4">
            </div>

            <div class="grid-2">
                <div class="field">
                    <label for="pCapacity">Capacité (L)</label>
                    <input type="number" id="pCapacity" min="1" max="200" step="1" inputmode="decimal" required>
                </div>
                <div class="field">
                    <label for="pBars">Barres totales</label>
                    <input type="number" id="pBars" min="1" max="50" step="1" inputmode="numeric" required>
                </div>
            </div>

            <div class="field">
                <label for="pFuel">Essence</label>
                <select id="pFuel" required>
                    <option value="SP95">SP95</option>
                    <option value="SP95E10">SP95-E10</option>
                    <option value="SP98E5">SP98-E5</option>
                </select>
            </div>

            <div class="modal-actions">
                <button type="button" class="btn-ghost" id="presetDelete" hidden>Supprimer</button>
                <div class="modal-actions-end">
                    <button type="button" class="btn-ghost" id="presetCancel">Annuler</button>
                    <button type="submit" class="btn-primary">Enregistrer</button>
                </div>
            </div>
        </form>
    </dialog>

    <script src="script.js"></script>
</body>
</html>
